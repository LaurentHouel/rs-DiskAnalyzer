name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev flatpak flatpak-builder \
            libxkbcommon-dev libwayland-dev libxcb1-dev libgl1-mesa-dev
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system --assumeyes --noninteractive flathub \
            org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="rs-disk-analyzer-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$name" dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/rs-disk-analyzer.exe "$name/"
            cp README.md "$name/"
            cp "$name/rs-disk-analyzer.exe" "dist/${name}.exe"
            7z a "dist/${name}.zip" "$name"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            scripts/bundle-macos.sh target/${{ matrix.target }}/release/rs-disk-analyzer "$name/Disk Analyzer.app"
            cp README.md "$name/"
            scripts/make-dmg.sh "$name/Disk Analyzer.app" "dist/${name}.dmg"
            ditto -c -k --keepParent "$name" "dist/${name}.zip"
          else
            bash scripts/package-linux.sh \
              "$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/rs-disk-analyzer" \
              "${{ matrix.target }}" "${{ github.ref_name }}" "$GITHUB_WORKSPACE/dist"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
