[package]
name = "rs-disk-analyzer"
version = "0.1.4"
edition = "2024"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["persistence"] }
egui = "0.37"
rayon = "1.12.0"
rfd = "0.18.0"
semver = "1.0"
serde_json = "1.0"
sysinfo = { version = "0.40.3", default-features = false, features = ["disk"] }
trash = "5.3.0"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep our own code fully debuggable while making dependencies (egui, rayon…) fast.
[profile.dev.package."*"]
opt-level = 3
# No debug info for dependencies: they dominate target/ size and are not stepped through.
debug = false

[dev-dependencies]
egui_kittest = "0.37"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
