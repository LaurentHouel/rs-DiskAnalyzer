[package]
name = "rs-disk-analyzer"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["persistence"] }
egui = "0.37"
rayon = "1.12.0"
rfd = "0.18.0"
sys-locale = "0.3.2"
trash = "5.3.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
